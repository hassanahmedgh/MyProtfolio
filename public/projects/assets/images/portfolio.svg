<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="pfGlow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#f5f5f0" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <filter id="pfSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#pfGlow)"/>

  <g font-family="'Consolas', 'Courier New', monospace" fill="#f5f5f0" fill-opacity="0.45" font-size="18" letter-spacing="4">
    <text x="64" y="64">PORTFOLIO ’26</text>
    <text x="1136" y="64" text-anchor="end">FULL-STACK / WEB</text>
    <text x="600" y="150" text-anchor="middle" fill-opacity="0.55">WELCOME</text>
  </g>

  <g filter="url(#pfSoft)" text-anchor="middle" font-family="'Comic Sans MS', 'Segoe UI', sans-serif" fill="#f7f5ec">
    <text x="600" y="330" font-size="132">hassan</text>
    <text x="600" y="452" font-size="132">ahmed</text>
  </g>

  <g font-family="'Consolas', 'Courier New', monospace" font-size="21" fill="#f5f5f0" fill-opacity="0.55" text-anchor="middle">
    <text x="600" y="528">a full-stack developer who builds fast,</text>
    <text x="600" y="558">responsive, production-ready web apps.</text>
  </g>

  <circle cx="600" cy="600" r="11" fill="#f5f5f0" fill-opacity="0.85"/>
</svg>
