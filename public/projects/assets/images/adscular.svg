      <stop offset="58%" stop-color="#050a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="adCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a2c"/>
      <stop offset="100%" stop-color="#0a1120"/>
