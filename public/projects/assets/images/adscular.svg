    <path d="M34 232 L96 214 L152 220 L208 188 L266 196 L322 160 L386 142" stroke="#29abe2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="386" cy="142" r="6" fill="#29abe2"/>
