    <text x="0" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#9fc4de" fill-opacity="0.85">Agency website · custom CMS · SEO/AEO schema</text>
    <text x="0" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#9fc4de" fill-opacity="0.85">Next.js · React · TypeScript · Firebase</text>
